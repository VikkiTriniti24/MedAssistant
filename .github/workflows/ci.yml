name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: ~/.cache/pip

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.8

      - name: Ruff Lint
        run: ruff check .

  tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      AI_STUB: "1"
      PYTEST_ADDOPTS: "-q"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest Suite
        run: pytest -m "slow or not slow"

      - name: Upload Coverage (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: .pytest_cache
          if-no-files-found: ignore

  staging-sim:
    name: Staging Parity Smoke
    runs-on: ubuntu-latest
    needs: tests
    environment:
      name: staging
      url: https://staging.medassistant.example
    env:
      ENV: staging
      FLASK_ENV: production
      AI_STUB: "1"
      PYTEST_ADDOPTS: "-q"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Staging Smoke Suite
        run: pytest -m "slow or not slow" tests/test_smoke.py

      - name: Package Application Artifact
        run: |
          mkdir -p dist
          tar -czf dist/medassistant-${{ github.sha }}.tar.gz health_app run.py requirements.txt requirements-dev.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: medassistant-build-${{ github.run_number }}
          path: dist/medassistant-${{ github.sha }}.tar.gz
