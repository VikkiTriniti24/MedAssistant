{% extends "base.html" %}
{% block title %}Login · My Health App{% endblock %}

{% block content %}
  <h2 class="page-title">Login</h2>

  <div id="loginMsg" class="alert hidden"></div>

  <form id="loginForm" class="card card-form card-form-compact">
    <div class="form-row">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" class="input" required placeholder="you@example.com" autocomplete="username" />
    </div>

    <div class="form-row">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" class="input" required autocomplete="current-password" />
    </div>

    <div class="center">
      <button type="submit" class="btn btn-primary">Login</button>
      <button type="button" id="btnLogout" class="btn btn-ghost">Logout</button>
    </div>
  </form>
{% endblock %}

{% block extra_scripts %}
<script nonce="{{ csp_nonce }}">
(function () {
  const $ = (s) => document.querySelector(s);
  const tr = (key) => (window.I18n ? window.I18n.t(key) : key);

  function showMsg(text, type = "warning") {
    const box = $("#loginMsg");
    if (!box) return;
    box.textContent = text || "";
    box.className = `alert ${type}`;
    if (!text) box.classList.add("hidden"); else box.classList.remove("hidden");
  }

  function saveToken(t) {
    try {
      if (t && typeof t === "string") {
        localStorage.setItem("access_token", t);
        localStorage.setItem("auth_flag", "1");
      }
    } catch (e) { console.error("localStorage save failed", e); }
  }
  function setFormDisabled(disabled) {
    const form = $("#loginForm");
    if (!form) return;
    if (disabled) {
      form.setAttribute("aria-disabled", "true");
    } else {
      form.removeAttribute("aria-disabled");
    }
    form.querySelectorAll("input, button").forEach((el) => {
      if (el.id === "btnLogout") return;
      el.disabled = disabled;
      if (disabled) el.setAttribute("aria-disabled", "true");
      else el.removeAttribute("aria-disabled");
    });
  }

  function clearToken() {
    localStorage.removeItem("access_token");
    localStorage.removeItem("auth_flag");
    setFormDisabled(false);
    window.dispatchEvent(new CustomEvent("auth:state-changed"));
  }

  // Bereits eingeloggt? Direkt zurück
  (async function precheck() {
    const tok = localStorage.getItem("access_token");
    if (!tok) return;
    try {
      const resp = await fetch("/auth/me", {
        headers: { "Authorization": `Bearer ${tok}` }
      });
      if (resp.ok) {
        let nextToken = tok;
        try {
          const refreshResp = await fetch("/auth/refresh", {
            method: "POST",
            credentials: "same-origin"
          });
          if (refreshResp.ok) {
            const refreshData = await refreshResp.json().catch(() => ({}));
            if (refreshData?.access_token) {
              nextToken = refreshData.access_token;
              saveToken(nextToken);
            }
          }
        } catch (refreshErr) {
          console.warn("refresh failed during login precheck", refreshErr);
        }
        if (!nextToken) {
          clearToken();
          return;
        }
        showMsg(tr("auth.login.already"), "success");
        window.dispatchEvent(new CustomEvent("auth:state-changed"));
        setFormDisabled(true);
        window.location.replace("/");
      } else if (resp.status === 401) {
        clearToken();
        window.dispatchEvent(new CustomEvent("auth:state-changed"));
      }
    } catch {
      clearToken();
      window.dispatchEvent(new CustomEvent("auth:state-changed"));
    }
  })();

  $("#btnLogout")?.addEventListener("click", async () => {
    try {
      const resp = await fetch("/auth/logout", {
        method: "POST",
        credentials: "same-origin"
      });
      if (!resp.ok && resp.status !== 401) {
        console.warn("logout returned status", resp.status);
      }
    } catch (err) {
      console.warn("logout request failed", err);
    }
    clearToken();
    showMsg(tr("common.logout_success"), "success");
  });

  $("#loginForm")?.addEventListener("submit", async (e) => {
    e.preventDefault();
    showMsg(tr("auth.login.logging_in"), "primary");

    const email = $("#email")?.value?.trim();
    const password = $("#password")?.value ?? "";

    if (!email || !password) {
      showMsg(tr("auth.login.missing_fields"), "warning");
      return;
    }

    try {
      const resp = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await resp.json().catch(() => ({}));

      if (!resp.ok) {
        const err = data?.error || data?.msg || tr("auth.login.generic_error");
        if (resp.status === 401) {
          showMsg(`${err} · ${tr("auth.login.hint_reset")}`, "danger");
        } else if (resp.status === 404) {
          showMsg(`${err} · ${tr("auth.login.hint_register")}`, "danger");
        } else {
          showMsg(err, "danger");
        }
        return;
      }

      const token = data?.access_token;
      if (!token) {
        showMsg(tr("auth.login.no_token"), "danger");
        return;
      }

      saveToken(token);
      window.dispatchEvent(new CustomEvent("auth:state-changed"));
      setFormDisabled(true);
      showMsg(tr("auth.login.success"), "success");
      setTimeout(() => { window.location.replace("/"); }, 300);
    } catch (err) {
      console.error(err);
      showMsg(tr("auth.login.network_error"), "danger");
    }
  });
})();
</script>
{% endblock %}
